# 검사와 배포 로직은 kwak-service-infra 에 모여 있다.
# 이 파일은 호출만 한다 — 검사 내용을 바꾸려면 infra 쪽을 고친다.
name: CI / Deploy

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    uses: Kyunglock/kwak-service-infra/.github/workflows/ci-backend.yml@main

  deploy:
    needs: ci
    # 수동 실행 전용 — Actions 탭의 "Run workflow" 로 main 을 골라야 돈다.
    # self-hosted 러너가 아직 등록돼 있지 않아, push 마다 배포를 걸면 job 이
    # 24시간 매달렸다가 자동 취소된다 (기존 deploy.yml 이 그래 왔다).
    # 러너를 등록한 뒤 자동 배포로 되돌리려면 아래 조건을
    #   github.event_name != 'pull_request'
    # 로 바꾸면 된다.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: Kyunglock/kwak-service-infra/.github/workflows/deploy-compose.yml@main
    with:
      stale-containers: 'redis api-gateway portal ai'
