spring:
  profiles:
    active: local
  application:
    name: portal

  mvc:
    async:
      request-timeout: -1

  servlet:
    multipart:
      # AI 매매기록의 증권사 화면 캡처 업로드용 (서비스단 상한은 4MB, 여유를 둔다)
      max-file-size: 6MB
      max-request-size: 8MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: insight-builder
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000} # 액세스 토큰 유효시간: 1시간 (로컬 테스트 시 env로 단축 가능)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 리프레시 토큰 유효시간: 7일
  rotation-grace: ${JWT_ROTATION_GRACE:60000} # 회전된 리프레시 토큰 유예시간: 60초

ai:
  base-url: ${AI_URI:http://localhost:8090}

collector:
  # 시황 질의응답의 온디맨드 뉴스 크롤링(CollectorGatewayClient)이 호출한다.
  # 지금까지 COLLECTOR_URI 는 n8n 전용 env 였고 Spring 프로퍼티로는 안 잡혀 있었다.
  base-url: ${COLLECTOR_URI:http://localhost:8000}

trade:
  extraction:
    n8n:
      # 매매기록 추출을 n8n 워크플로우로 보낼지 여부.
      # 워크플로우가 실제로 도는 걸 확인하기 전까지는 false 로 둔다.
      # 실패하면 ai 모듈 직접 호출로 자동 폴백하므로 켜도 기능이 죽지는 않는다.
      enabled: ${TRADE_EXTRACTION_VIA_N8N:false}
      url: ${TRADE_EXTRACTION_N8N_URL:http://localhost:5678/webhook/trade-extract}
      # n8n 워크플로우 상한(600초)보다 짧게 — 여기서 먼저 끊고 폴백한다
      timeout-seconds: ${TRADE_EXTRACTION_N8N_TIMEOUT:360}

system:
  # survey-service의 SystemSurveyController(뉴스 크롤러 연동)가 사용하는 내부 시스템 API 키
  api-key: ${SYSTEM_API_KEY}

mybatis:
  # classpath*: (별표) 필수 — 병합된 core에서 survey/market/advisor 매퍼 XML은
  # 각 라이브러리 모듈(별도 classpath 루트/jar)에 있어, classpath: (단일)이면
  # portal 자신의 mapper/ 루트만 스캔되어 나머지 모듈 매퍼가 미로딩됨.
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.investment
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  error:
    whitelabel:
      enabled: false
    include-message: always
    include-exception: false
    include-stacktrace: never
  servlet:
    session:
      cookie:
        secure: false # HTTP 허용
        same-site: lax # None이면 Secure 필수

app:
  cookie:
    # JWT 쿠키 Secure 플래그. 로컬(HTTP)은 false, HTTPS 배포 시 env로 true 오버라이드
    secure: ${AUTH_COOKIE_SECURE:false}

stock:
  api:
    finnhub:
      base-url: https://finnhub.io/api/v1
      api-key: ${FINNHUB_API_KEY:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger
    operations-sorter: alpha
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health, info
